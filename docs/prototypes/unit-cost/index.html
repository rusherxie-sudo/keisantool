<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日用品の1回コスト比較 — 未公開実験</title>
<style>[hidden]{display:none!important}body{font:16px/1.6 system-ui;margin:0;background:#f7f5f1;color:#243139}main{max-width:920px;margin:auto;padding:24px}h1{font-size:1.7rem}.note{padding:12px;background:#fff3ce;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}fieldset{background:white;border:1px solid #c6cecb;border-radius:12px;padding:18px;min-width:0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;border:1px solid #9ba9a4;border-radius:6px;max-width:100%;box-sizing:border-box}input{width:100%}.pair{display:grid;grid-template-columns:2fr 1fr;gap:8px}button{background:#235b4c;color:white;cursor:pointer}output{display:block;background:white;padding:16px;border-radius:12px;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}#error{color:#a32323}small{display:block;color:#50615b}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:14px}td,th{padding:5px}}</style>
<main><p>未公開・ローカル原型 / 本番サイトへの組込みなし</p><h1>容量と使用量から、1回のコストを比べる</h1><p>洗剤などの候補を同じ使用目的で比較します。濃縮度・洗浄力・品質が同じとは判定しません。</p><p class="note">使い切り日数は需要未検証の実験表示です。実際の消費量・使用期限を保証しません。ポイントは現金値引きに換算しません。</p>
<form id="compare"><div class="grid" id="products"></div><label>比較期間（日）<input id="period" type="number" min="1" value="30" required></label><button type="submit">比較する</button><button type="reset">入力を消す</button></form><p id="error" role="alert"></p><output id="result" hidden aria-live="polite"></output><p>容量÷1回量＝使用回数。税込価格÷使用回数＝1回コスト。期間支出は在庫0から必要な袋数を買う仮定（端数袋は切上げ）。送料・クーポン・期限付きポイントの価値は含みません。</p></main>
<script type="module">
import {compareProducts} from './model.mjs';
const units='<option>mL</option><option>L</option><option>g</option><option>kg</option><option value="piece">個</option>';
const fields=[['price','税込価格（円）',600],['quantity','1袋・1本の容量',1000],['dose','1回の使用量',10],['perDay','1日の使用回数',2],['points','獲得予定ポイント（値引きしない）',60]];
document.querySelector('#products').innerHTML=['A','B'].map((name,i)=>`<fieldset><legend>候補${name}</legend>${fields.map(([key,label,value])=>`<label for="${key}-${i}">${label}</label><div class="pair"><input id="${key}-${i}" name="${key}-${i}" type="number" step="any" min="0" value="${i&&key==='price'?500:value}" required>${key==='quantity'||key==='dose'?`<select aria-label="候補${name} ${label}の単位" id="${key}Unit-${i}">${units}</select>`:''}</div>`).join('')}</fieldset>`).join('');
const result=document.querySelector('#result'),error=document.querySelector('#error'),form=document.querySelector('form');
const fmt=n=>n===null?'使用なし':n.toLocaleString('ja-JP',{maximumFractionDigits:3});
form.addEventListener('submit',event=>{event.preventDefault();result.hidden=true;error.textContent='';try{
 const products=[0,1].map(i=>{const p=Object.fromEntries(fields.map(([k])=>[k,document.getElementById(`${k}-${i}`).value===''?NaN:Number(document.getElementById(`${k}-${i}`).value)]));p.unit=document.getElementById(`quantityUnit-${i}`).value;p.doseUnit=document.getElementById(`doseUnit-${i}`).value;return p;});
 const r=compareProducts(products,Number(document.querySelector('#period').value));
 const rows=[['1回の現金コスト（円）','cashPerUse'],['1袋の支払い（円）','cashOutlay'],['獲得予定ポイント（別枠）','points'],['計算上の使用回数','uses'],['使い切り日数（実験）','daysToFinish'],['期間の購入袋数','periodPacks'],['期間の現金支出（円）','periodCash']];
 result.innerHTML=`<strong>1回コストが低い候補：${r.products[0].cashPerUse===r.products[1].cashPerUse?'同額':['A','B'][r.cheapestPerUse]}</strong><table><thead><tr><th>比較項目</th><th>A</th><th>B</th></tr></thead><tbody>${rows.map(([label,k])=>`<tr><th>${label}</th>${r.products.map(p=>`<td>${fmt(p[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;result.hidden=false;
 }catch(e){error.textContent=e.message;}});
form.addEventListener('input',()=>{result.hidden=true;error.textContent='';});form.addEventListener('reset',event=>{event.preventDefault();form.querySelectorAll('input').forEach(el=>el.value='');result.hidden=true;error.textContent='';});
</script></html>
