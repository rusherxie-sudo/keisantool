<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">運命数・星数・運命星の計算手順</title><desc id="desc">1985年8月15日を例にした4段階の計算。数字は公開運命数表と本サイトで照合。</desc><rect width="640" height="800" rx="24" fill="#f7f4fc"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" fill="#28223c"><text x="32" y="54" font-size="29" fill="#28223c" font-weight="700" text-anchor="start">生年月日から12タイプを求める</text><rect x="28" y="88" width="584" height="116" rx="16" fill="white" stroke="#d8cce9"/><text x="48" y="128" font-size="25" fill="#28223c" font-weight="700" text-anchor="start">1　出生年と月の運命数</text><text x="48" y="170" font-size="26" fill="#67469f" font-weight="400" text-anchor="start">1985年8月 → 9</text><path d="M320 212 v14 m-8-6 8 8 8-8" stroke="#7953c4" stroke-width="3" fill="none"/><rect x="28" y="236" width="584" height="116" rx="16" fill="white" stroke="#d8cce9"/><text x="48" y="276" font-size="25" fill="#28223c" font-weight="700" text-anchor="start">2　星数を計算</text><text x="48" y="318" font-size="26" fill="#67469f" font-weight="400" text-anchor="start">9 − 1 ＋ 15日 ＝ 23</text><path d="M320 360 v14 m-8-6 8 8 8-8" stroke="#7953c4" stroke-width="3" fill="none"/><rect x="28" y="384" width="584" height="116" rx="16" fill="white" stroke="#d8cce9"/><text x="48" y="424" font-size="25" fill="#28223c" font-weight="700" text-anchor="start">3　星数の範囲から運命星</text><text x="48" y="466" font-size="26" fill="#67469f" font-weight="400" text-anchor="start">23は21〜30 → 火星人</text><path d="M320 508 v14 m-8-6 8 8 8-8" stroke="#7953c4" stroke-width="3" fill="none"/><rect x="28" y="532" width="584" height="116" rx="16" fill="white" stroke="#d8cce9"/><text x="48" y="572" font-size="25" fill="#28223c" font-weight="700" text-anchor="start">4　出生年の干支で陽陰</text><text x="48" y="614" font-size="26" fill="#67469f" font-weight="400" text-anchor="start">1985年は丑 → マイナス</text><text x="320" y="722" font-size="27" fill="#28223c" font-weight="700" text-anchor="middle">この例の結果：火星人マイナス</text><text x="320" y="763" font-size="22" fill="#28223c" font-weight="400" text-anchor="middle">暦年方式（年の境界は1月1日）</text></g></svg>