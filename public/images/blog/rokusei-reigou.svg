<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc"><title id="title">霊合星人の主星と副星の3組</title><desc id="desc">土星人と天王星人、金星人と木星人、火星人と水星人。同じプラス・マイナスで組み合わせる。</desc><rect width="640" height="620" rx="24" fill="#f7f4fc"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" fill="#28223c"><text x="32" y="54" font-size="29" fill="#28223c" font-weight="700" text-anchor="start">霊合星人の主星と副星の対応</text><text x="32" y="94" font-size="22" fill="#28223c" font-weight="400" text-anchor="start">該当する人は、同じ陽陰の対を参照</text><rect x="28" y="126" width="584" height="84" rx="16" fill="white" stroke="#d8cce9"/><text x="70" y="179" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">土星人</text><text x="320" y="179" font-size="34" fill="#7953c4" font-weight="400" text-anchor="middle">↔</text><text x="400" y="179" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">天王星人</text><rect x="28" y="234" width="584" height="84" rx="16" fill="white" stroke="#d8cce9"/><text x="70" y="287" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">金星人</text><text x="320" y="287" font-size="34" fill="#7953c4" font-weight="400" text-anchor="middle">↔</text><text x="400" y="287" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">木星人</text><rect x="28" y="342" width="584" height="84" rx="16" fill="white" stroke="#d8cce9"/><text x="70" y="395" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">火星人</text><text x="320" y="395" font-size="34" fill="#7953c4" font-weight="400" text-anchor="middle">↔</text><text x="400" y="395" font-size="30" fill="#28223c" font-weight="700" text-anchor="start">水星人</text><text x="320" y="496" font-size="25" fill="#28223c" font-weight="700" text-anchor="middle">プラス同士 ／ マイナス同士</text><text x="320" y="544" font-size="23" fill="#28223c" font-weight="400" text-anchor="middle">例：木星人プラス ↔ 金星人プラス</text><text x="320" y="586" font-size="22" fill="#28223c" font-weight="400" text-anchor="middle">判定条件：生まれた年が主星の「停止」</text></g></svg>