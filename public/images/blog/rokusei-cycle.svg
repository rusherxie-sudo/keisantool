<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc"><title id="title">六星占術の年運12段階</title><desc id="desc">種子、緑生、立花、健弱、達成、乱気、再会、財成、安定、陰影、停止、減退の順。</desc><rect width="640" height="950" rx="24" fill="#f7f4fc"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" fill="#28223c"><text x="32" y="54" font-size="29" fill="#28223c" font-weight="700" text-anchor="start">年運の12段階を順番で読む</text><text x="32" y="90" font-size="22" fill="#28223c" font-weight="400" text-anchor="start">番号順に1年ずつ進み、12の次は1へ</text><rect x="28" y="120" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="46" y="160" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">01　種子</text><text x="46" y="196" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="328" y="120" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="346" y="160" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">02　緑生</text><text x="346" y="196" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="28" y="240" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="46" y="280" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">03　立花</text><text x="46" y="316" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="328" y="240" width="284" height="100" rx="14" fill="#fff4db" stroke="#d8cce9"/><text x="346" y="280" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">04　健弱</text><text x="346" y="316" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">小殺界</text><rect x="28" y="360" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="46" y="400" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">05　達成</text><text x="46" y="436" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="328" y="360" width="284" height="100" rx="14" fill="#fff4db" stroke="#d8cce9"/><text x="346" y="400" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">06　乱気</text><text x="346" y="436" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">中殺界</text><rect x="28" y="480" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="46" y="520" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">07　再会</text><text x="46" y="556" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="328" y="480" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="346" y="520" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">08　財成</text><text x="346" y="556" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="28" y="600" width="284" height="100" rx="14" fill="#ffffff" stroke="#d8cce9"/><text x="46" y="640" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">09　安定</text><text x="46" y="676" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">好調</text><rect x="328" y="600" width="284" height="100" rx="14" fill="#f9e8e9" stroke="#d8cce9"/><text x="346" y="640" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">10　陰影</text><text x="346" y="676" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">大殺界</text><rect x="28" y="720" width="284" height="100" rx="14" fill="#f9e8e9" stroke="#d8cce9"/><text x="46" y="760" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">11　停止</text><text x="46" y="796" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">大殺界</text><rect x="328" y="720" width="284" height="100" rx="14" fill="#f9e8e9" stroke="#d8cce9"/><text x="346" y="760" font-size="28" fill="#28223c" font-weight="700" text-anchor="start">12　減退</text><text x="346" y="796" font-size="22" fill="#64596f" font-weight="400" text-anchor="start">大殺界</text><text x="320" y="875" font-size="25" fill="#28223c" font-weight="700" text-anchor="middle">減退（12）→ 種子（1）へ戻る</text><text x="320" y="918" font-size="21" fill="#28223c" font-weight="400" text-anchor="middle">年運の分類であり、出来事の予測ではありません</text></g></svg>